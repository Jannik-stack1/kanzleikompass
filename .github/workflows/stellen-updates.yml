name: Stellen aktualisieren
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-job-catalog
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Parser und Bestandsschutz prüfen
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Offizielle Quellen prüfen
        run: python scripts/update_jobs.py
      - name: Öffentlichen Prüfstand speichern
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stellen-updates.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen am Prüfstand."
            exit 0
          fi
          git commit -m "Stellenquellen aktualisieren"
          git push origin "HEAD:$DEFAULT_BRANCH"
